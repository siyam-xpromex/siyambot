
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="960" height="560" viewBox="0 0 960 560"
     role="img" aria-label="SIYAM HASAN - MIRAI GOAT MIX BOT">

  <title>SIYAM HASAN — MIRAI GOAT MIX BOT</title>

  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#172C50"/>
      <stop offset="55%" stop-color="#091426"/>
      <stop offset="100%" stop-color="#030711"/>
    </radialGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF4B0"/>
      <stop offset="45%" stop-color="#F7C65B"/>
      <stop offset="100%" stop-color="#B97820"/>
    </linearGradient>

    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7DF9FF"/>
      <stop offset="50%" stop-color="#20B9FF"/>
      <stop offset="100%" stop-color="#315BFF"/>
    </linearGradient>

    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B5FFD7"/>
      <stop offset="50%" stop-color="#35E6A0"/>
      <stop offset="100%" stop-color="#07966E"/>
    </linearGradient>

    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E6B8FF"/>
      <stop offset="50%" stop-color="#A66BFF"/>
      <stop offset="100%" stop-color="#6937D9"/>
    </linearGradient>

    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#36E7FF"/>
      <stop offset="30%" stop-color="#8A72FF"/>
      <stop offset="60%" stop-color="#F08BFF"/>
      <stop offset="100%" stop-color="#FFD978"/>
    </linearGradient>

    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bigGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="b"/>
      <feOffset dy="6"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope=".55"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none"
            stroke="#76CFFF" stroke-opacity=".07"/>
    </pattern>

    <polygon id="hex"
      points="0,-84 73,-42 73,42 0,84 -73,42 -73,-42"/>

    <clipPath id="nameClip">
      <text x="480" y="294" text-anchor="middle"
        font-family="Verdana,Arial,sans-serif"
        font-size="76" font-weight="900"
        letter-spacing="5">SIYAM HASAN</text>
    </clipPath>
  </defs>

  <!-- BACKGROUND -->
  <rect width="960" height="560" rx="32" fill="url(#bg)"/>
  <rect width="960" height="560" rx="32" fill="url(#grid)"/>

  <!-- AURORA LIGHTS -->
  <g>
    <circle cx="170" cy="170" r="130" fill="#16CFFF"
      opacity=".15" filter="url(#bigGlow)">
      <animate attributeName="cx" values="170;260;170"
        dur="9s" repeatCount="indefinite"/>
    </circle>

    <circle cx="790" cy="190" r="140" fill="#9B5CFF"
      opacity=".18" filter="url(#bigGlow)">
      <animate attributeName="cx" values="790;700;790"
        dur="8s" repeatCount="indefinite"/>
    </circle>

    <circle cx="480" cy="470" r="150" fill="#1ADCA0"
      opacity=".12" filter="url(#bigGlow)">
      <animate attributeName="opacity" values=".08;.22;.08"
        dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- STARS -->
  <g fill="#FFFFFF">
    <circle cx="70" cy="65" r="2.5">
      <animate attributeName="opacity" values=".1;1;.1"
        dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="890" cy="80" r="2">
      <animate attributeName="opacity" values="1;.1;1"
        dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="480" cy="42" r="2.5">
      <animate attributeName="opacity" values=".1;1;.1"
        dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="420" r="2">
      <animate attributeName="opacity" values="1;.1;1"
        dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="440" r="2.5">
      <animate attributeName="opacity" values=".1;1;.1"
        dur="2.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="70" r="1.8">
      <animate attributeName="opacity" values=".1;1;.1"
        dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="680" cy="65" r="2">
      <animate attributeName="opacity" values="1;.1;1"
        dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- OUTER FRAME -->
  <rect x="4" y="4" width="952" height="552" rx="30"
    fill="none" stroke="url(#rainbow)" stroke-width="2.5"
    filter="url(#glow)" opacity=".85">
    <animate attributeName="opacity" values=".5;1;.5"
      dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- INTRO: SIYAM HASAN -->
  <g>
    <animate attributeName="opacity"
      values="0;1;1;0"
      keyTimes="0;.12;.76;1"
      dur="4.2s" begin="0s" fill="freeze"/>

    <animateTransform attributeName="transform"
      type="translate"
      values="0,45;0,0;0,0;0,-35"
      keyTimes="0;.18;.75;1"
      dur="4.2s" begin="0s" fill="freeze"/>

    <animateTransform attributeName="transform"
      additive="sum" type="scale"
      values=".65;1.08;1;1.12"
      keyTimes="0;.2;.75;1"
      dur="4.2s" begin="0s" fill="freeze"/>

    <ellipse cx="480" cy="275" rx="300" ry="95"
      fill="#E5B95D" opacity=".16" filter="url(#bigGlow)">
      <animate attributeName="opacity" values="0;.35;.25;0"
        dur="4.2s" fill="freeze"/>
    </ellipse>

    <text x="480" y="294" text-anchor="middle"
      font-family="Verdana,Arial,sans-serif"
      font-size="76" font-weight="900"
      letter-spacing="5" fill="url(#gold)"
      filter="url(#glow)">
      SIYAM HASAN
    </text>

    <text x="480" y="337" text-anchor="middle"
      font-family="Verdana,Arial,sans-serif"
      font-size="17" font-weight="700"
      letter-spacing="9" fill="#D6E9FF">
      THE CREATOR
    </text>

    <path d="M260 355 H700" stroke="url(#rainbow)"
      stroke-width="2" opacity=".8">
      <animate attributeName="stroke-dasharray"
        values="0 440;440 0"
        dur="2s" fill="freeze"/>
    </path>

    <!-- NAME SHINE -->
    <g clip-path="url(#nameClip)">
      <rect x="-180" y="195" width="120" height="125"
        fill="url(#shine)" transform="skewX(-22)">
        <animate attributeName="x" values="-180;1100"
          dur="2.2s" begin=".5s" fill="freeze"/>
      </rect>
    </g>
  </g>

  <!-- MIRAI AND GOAT: ENTER AFTER INTRO -->
  <g opacity="0">
    <animate attributeName="opacity"
      values="0;0;1;1"
      keyTimes="0;.2;.48;1"
      dur="6s" begin="2.8s" fill="freeze"/>

    <!-- CENTER ENERGY LINK -->
    <g>
      <line x1="320" y1="220" x2="640" y2="220"
        stroke="url(#rainbow)" stroke-width="5"
        opacity=".55" filter="url(#glow)"/>

      <line x1="320" y1="220" x2="640" y2="220"
        stroke="#FFFFFF" stroke-width="2"
        stroke-dasharray="5 13" stroke-linecap="round">
        <animate attributeName="stroke-dashoffset"
          from="0" to="-72" dur="1.2s"
          repeatCount="indefinite"/>
      </line>

      <circle cy="220" r="5" fill="#FFFFFF" filter="url(#glow)">
        <animate attributeName="cx"
          values="320;640;320" dur="3s"
          repeatCount="indefinite"/>
      </circle>

      <circle cx="480" cy="220" r="24"
        fill="#101B31" stroke="url(#gold)"
        stroke-width="3" filter="url(#glow)">
        <animate attributeName="r" values="20;26;20"
          dur="2s" repeatCount="indefinite"/>
      </circle>

      <text x="480" y="230" text-anchor="middle"
        font-size="29" font-weight="900" fill="#FFFFFF">×</text>
    </g>

    <!-- LEFT MIRAI -->
    <g>
      <animateTransform attributeName="transform"
        type="translate" values="0,-7;0,7;0,-7"
        dur="4s" repeatCount="indefinite"/>

      <g transform="translate(200,220)">
        <circle r="115" fill="#1ACBFF"
          opacity=".24" filter="url(#bigGlow)"/>

        <!-- outer glowing ring -->
        <circle r="116" fill="none" stroke="url(#blue)"
          stroke-width="6" stroke-dasharray="25 10"
          stroke-linecap="round" filter="url(#glow)">
          <animateTransform attributeName="transform"
            type="rotate" from="0" to="360"
            dur="13s" repeatCount="indefinite"/>
        </circle>

        <!-- pulsing circular light -->
        <circle r="105" fill="none" stroke="#65EFFF"
          stroke-width="3" opacity=".35">
          <animate attributeName="r" values="99;112;99"
            dur="2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values=".2;1;.2"
            dur="2s" repeatCount="indefinite"/>
        </circle>

        <circle r="96" fill="none" stroke="#FFFFFF"
          stroke-width="1.5" stroke-dasharray="3 9"
          opacity=".45">
          <animateTransform attributeName="transform"
            type="rotate" from="360" to="0"
            dur="20s" repeatCount="indefinite"/>
        </circle>

        <!-- orbit lights -->
        <g>
          <animateTransform attributeName="transform"
            type="rotate" from="0" to="360"
            dur="5s" repeatCount="indefinite"/>
          <circle cx="116" cy="0" r="7"
            fill="#FFFFFF" filter="url(#glow)"/>
          <circle cx="-116" cy="0" r="4"
            fill="#55E9FF" filter="url(#glow)"/>
        </g>

        <use xlink:href="#hex" href="#hex"
          fill="#0A1B35" stroke="url(#blue)"
          stroke-width="6" filter="url(#glow)"/>

        <use xlink:href="#hex" href="#hex"
          fill="url(#glass)"/>

        <!-- M symbol -->
        <path d="M-38 35 L-38 -30 L0 12 L38 -30 L38 35"
          fill="none" stroke="url(#blue)"
          stroke-width="14" stroke-linecap="round"
          stroke-linejoin="round" filter="url(#glow)"/>

        <path d="M-38 35 L-38 -30 L0 12 L38 -30 L38 35"
          fill="none" stroke="#FFFFFF"
          stroke-width="3" stroke-linecap="round"
          stroke-linejoin="round" opacity=".8"/>

        <g fill="#FFFFFF">
          <circle cx="-38" cy="-30" r="5"/>
          <circle cx="38" cy="-30" r="5"/>
          <circle cx="0" cy="12" r="5"/>
        </g>

        <path d="M0 -65 L6 -50 L21 -47 L9 -36
          L12 -21 L0 -29 L-12 -21 L-9 -36
          L-21 -47 L-6 -50 Z"
          fill="url(#gold)" filter="url(#glow)">
          <animate attributeName="opacity"
            values=".5;1;.5" dur="1.5s"
            repeatCount="indefinite"/>
        </path>
      </g>

      <text x="200" y="375" text-anchor="middle"
        font-family="Verdana,Arial,sans-serif"
        font-size="25" font-weight="900"
        letter-spacing="9" fill="#7CEBFF"
        filter="url(#glow)">MIRAI</text>
    </g>

    <!-- RIGHT GOAT -->
    <g>
      <animateTransform attributeName="transform"
        type="translate" values="0,7;0,-7;0,7"
        dur="4s" repeatCount="indefinite"/>

      <g transform="translate(760,220)">
        <circle r="115" fill="#9A5AFF"
          opacity=".23" filter="url(#bigGlow)"/>

        <circle r="116" fill="none" stroke="url(#violet)"
          stroke-width="6" stroke-dasharray="25 10"
          stroke-linecap="round" filter="url(#glow)">
          <animateTransform attributeName="transform"
            type="rotate" from="360" to="0"
            dur="13s" repeatCount="indefinite"/>
        </circle>

        <!-- pulsing circular light -->
        <circle r="105" fill="none" stroke="#D6A0FF"
          stroke-width="3" opacity=".35">
          <animate attributeName="r" values="99;112;99"
            dur="2.2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values=".2;1;.2"
            dur="2.2s" repeatCount="indefinite"/>
        </circle>

        <circle r="96" fill="none" stroke="#FFFFFF"
          stroke-width="1.5" stroke-dasharray="3 9"
          opacity=".45">
          <animateTransform attributeName="transform"
            type="rotate" from="0" to="360"
            dur="20s" repeatCount="indefinite"/>
        </circle>

        <g>
          <animateTransform attributeName="transform"
            type="rotate" from="360" to="0"
            dur="5s" repeatCount="indefinite"/>
          <circle cx="116" cy="0" r="7"
            fill="#FFFFFF" filter="url(#glow)"/>
          <circle cx="-116" cy="0" r="4"
            fill="#D7A5FF" filter="url(#glow)"/>
        </g>

        <use xlink:href="#hex" href="#hex"
          fill="#17102F" stroke="url(#violet)"
          stroke-width="6" filter="url(#glow)"/>

        <use xlink:href="#hex" href="#hex"
          fill="url(#glass)"/>

        <!-- ORIGINAL GOAT SYMBOL -->
        <g filter="url(#glow)">
          <path d="M-17 -27 C-48 -40 -52 -68 -30 -75
            C-40 -58 -29 -49 -12 -44"
            fill="url(#gold)"/>

          <path d="M17 -27 C48 -40 52 -68 30 -75
            C40 -58 29 -49 12 -44"
            fill="url(#gold)"/>

          <path d="M-24 -14 L-55 -24 L-30 -2 Z"
            fill="url(#violet)"/>

          <path d="M24 -14 L55 -24 L30 -2 Z"
            fill="url(#violet)"/>

          <path d="M-26 -34 Q0 -46 26 -34
            L22 7 Q20 23 10 30
            L-10 30 Q-20 23 -22 7 Z"
            fill="url(#violet)"/>

          <path d="M-10 29 L0 57 L10 29 Z"
            fill="url(#gold)"/>
        </g>

        <!-- eyes -->
        <path d="M-18 -13 L-6 -8 L-18 -4 Z"
          fill="#0A1020"/>
        <path d="M18 -13 L6 -8 L18 -4 Z"
          fill="#0A1020"/>

        <circle cx="-4" cy="21" r="2.5" fill="#0A1020"/>
        <circle cx="4" cy="21" r="2.5" fill="#0A1020"/>

        <path d="M-14 -31 Q0 -39 14 -31"
          fill="none" stroke="#FFFFFF"
          stroke-width="2.5" stroke-linecap="round"
          opacity=".7"/>
      </g>

      <text x="760" y="375" text-anchor="middle"
        font-family="Verdana,Arial,sans-serif"
        font-size="25" font-weight="900"
        letter-spacing="9" fill="#D8B5FF"
        filter="url(#glow)">GOAT</text>
    </g>

    <!-- BOT TITLE -->
    <text x="480" y="445" text-anchor="middle"
      font-family="Verdana,Arial,sans-serif"
      font-size="44" font-weight="900"
      letter-spacing="5" fill="url(#gold)"
      filter="url(#glow)">SIYAM HASAN BOT</text>

    <text x="480" y="478" text-anchor="middle"
      font-family="Verdana,Arial,sans-serif"
      font-size="15" font-weight="700"
      letter-spacing="8" fill="#C8DFFF">
      MIRAI + GOAT HYBRID SYSTEM
    </text>

    <!-- FORK RIBBON -->
    <g transform="translate(480,520)">
      <rect x="-220" y="-20" width="440" height="40"
        rx="20" fill="#0B172B"
        stroke="url(#rainbow)" stroke-width="2.5"
        filter="url(#glow)"/>

      <rect x="-220" y="-20" width="440" height="40"
        rx="20" fill="url(#glass)"/>

      <circle cx="-195" cy="0" r="5" fill="#45E8FF">
        <animate attributeName="opacity"
          values="1;.2;1" dur="1.3s"
          repeatCount="indefinite"/>
      </circle>

      <circle cx="195" cy="0" r="5" fill="#D49AFF">
        <animate attributeName="opacity"
          values=".2;1;.2" dur="1.3s"
          repeatCount="indefinite"/>
      </circle>

      <text y="7" text-anchor="middle"
        font-family="Courier New,monospace"
        font-size="20" font-weight="900"
        letter-spacing="3" fill="#FFFFFF">
        MIRAI_GOAT_MIX_FORK
      </text>
    </g>
  </g>
</svg>
