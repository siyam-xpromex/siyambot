     xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns:html="http://www.w3.org/1999/xhtml"
     viewBox="0 0 960 1400" width="960" height="1400">

<title>SIYAM HASAN — WELCOME TO REALITY</title>

<defs>
  <linearGradient id="bg" x2="1" y2="1">
    <stop stop-color="#08051c"/>
    <stop offset=".48" stop-color="#10112d"/>
    <stop offset="1" stop-color="#02040d"/>
  </linearGradient>

  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#00f5ff"/>
    <stop offset=".32" stop-color="#8c52ff"/>
    <stop offset=".65" stop-color="#ff38b8"/>
    <stop offset="1" stop-color="#ffe66d"/>
    <animate attributeName="x1" values="0;1;0" dur="6s" repeatCount="indefinite"/>
  </linearGradient>

  <linearGradient id="silver" x2="0" y2="1">
    <stop stop-color="#ffffff"/>
    <stop offset=".5" stop-color="#8cf9ff"/>
    <stop offset="1" stop-color="#4c91d9"/>
  </linearGradient>

  <radialGradient id="glow">
    <stop stop-color="#00eaff" stop-opacity=".35"/>
    <stop offset="1" stop-color="#00eaff" stop-opacity="0"/>
  </radialGradient>

  <filter id="shine" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="8" result="b"/>
    <feMerge>
      <feMergeNode in="b"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="shadow">
    <feGaussianBlur stdDeviation="16"/>
  </filter>

  <clipPath id="listClip">
    <rect x="105" y="525" width="750" height="690" rx="28"/>
  </clipPath>

  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
    <path d="M42 0H0V42" fill="none" stroke="#8bfaff" stroke-opacity=".07"/>
    <circle cx="1" cy="1" r="1.5" fill="#8bfaff" opacity=".2"/>
  </pattern>
</defs>

<!-- BACKGROUND -->
<rect width="960" height="1400" rx="40" fill="url(#bg)"/>
<rect width="960" height="1400" rx="40" fill="url(#grid)"/>

<circle cx="120" cy="250" r="300" fill="url(#glow)">
  <animate attributeName="r" values="240;340;240" dur="7s" repeatCount="indefinite"/>
</circle>
<circle cx="850" cy="1000" r="360" fill="url(#glow)">
  <animate attributeName="r" values="300;400;300" dur="8s" repeatCount="indefinite"/>
</circle>

<!-- FRAME -->
<rect x="20" y="20" width="920" height="1360" rx="38"
      fill="none" stroke="url(#neon)" stroke-width="3" filter="url(#shine)"/>
<rect x="34" y="34" width="892" height="1332" rx="30"
      fill="none" stroke="#ffffff" stroke-opacity=".16"/>

<!-- CORNER LIGHTS -->
<g fill="#ffffff" filter="url(#shine)">
