
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="SIYAM CHAT BOT — Auto Cookie — Auto Facebook Login">
  <title>SIYAM CHAT BOT — Auto Cookie • Auto Facebook Login</title>

  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="85%">
      <stop offset="0%" stop-color="#123c35"/>
      <stop offset="55%" stop-color="#071d24"/>
      <stop offset="100%" stop-color="#02090e"/>
    </radialGradient>

    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b7ff3c">
        <animate attributeName="stop-color" values="#b7ff3c;#00ffc8;#eaff9b;#54eaff;#b7ff3c" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#00ffc8">
        <animate attributeName="stop-color" values="#00ffc8;#eaff9b;#54eaff;#b7ff3c;#00ffc8" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#54eaff">
        <animate attributeName="stop-color" values="#54eaff;#b7ff3c;#00ffc8;#eaff9b;#54eaff" dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4ff9b"/>
      <stop offset="100%" stop-color="#9cff38"/>
    </linearGradient>

    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ffc8" stop-opacity="0.10"/>
      <stop offset="50%" stop-color="#b7ff3c" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#54eaff" stop-opacity="0.10"/>
    </linearGradient>

    <linearGradient id="cookie" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe6a0"/>
      <stop offset="100%" stop-color="#bd782e"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="pulseGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur">
        <animate attributeName="stdDeviation" values="3;11;3" dur="2s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#b7ff3c" fill-opacity="0.10"/>
    </pattern>

    <clipPath id="frame">
      <rect x="6" y="6" width="948" height="408" rx="26"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="960" height="420" rx="30" fill="url(#bg)"/>
  <rect width="960" height="420" rx="30" fill="url(#dots)"/>

  <g clip-path="url(#frame)">
    <circle cx="90" cy="60" r="150" fill="#00ffc8" fill-opacity="0.09"/>
    <circle cx="880" cy="360" r="190" fill="#b7ff3c" fill-opacity="0.07"/>
    <circle cx="500" cy="-20" r="120" fill="#54eaff" fill-opacity="0.08"/>
    <circle cx="480" cy="210" r="190" fill="none" stroke="#00ffc8" stroke-opacity="0.06"/>
    <circle cx="480" cy="210" r="220" fill="none" stroke="#b7ff3c" stroke-opacity="0.05"/>
  </g>

  <!-- Main frame -->
  <rect x="6" y="6" width="948" height="408" rx="26"
        fill="none" stroke="url(#title)" stroke-width="3" filter="url(#glow)"/>
  <rect x="16" y="16" width="928" height="388" rx="20"
        fill="none" stroke="#b7ff3c" stroke-opacity="0.16"
        stroke-width="1" stroke-dasharray="3 7"/>

  <!-- Corner lights -->
  <g fill="url(#title)" filter="url(#pulseGlow)">
    <circle cx="35" cy="35" r="3"/>
    <circle cx="925" cy="35" r="3"/>
    <circle cx="35" cy="385" r="3"/>
    <circle cx="925" cy="385" r="3"/>
  </g>

  <!-- Left circular cookie profile -->
  <g transform="translate(150 190)">

    <!-- Outer pulsing circular light -->
    <circle r="101" fill="none" stroke="#00ffc8" stroke-width="2"
            filter="url(#pulseGlow)">
      <animate attributeName="r" values="91;103;91" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- Second light ring -->
    <circle r="94" fill="none" stroke="#b7ff3c" stroke-width="2"
            stroke-dasharray="5 12" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate"
                        from="0" to="360" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/>
    </circle>

    <!-- Rotating dotted ring -->
    <circle r="86" fill="none" stroke="url(#title)" stroke-width="3"
            stroke-dasharray="14 10" filter="url(#pulseGlow)">
      <animateTransform attributeName="transform" type="rotate"
                        from="0" to="360" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="2;5;2" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- Cookie -->
    <circle r="66" fill="url(#cookie)" stroke="#fff0b8"
            stroke-opacity="0.7" stroke-width="2" filter="url(#glow)"/>

    <path d="M 40 -52 A 24 24 0 0 0 66 -10 A 66 66 0 0 0 40 -52 Z"
          fill="#071d24"/>

    <g fill="#74400e">
      <circle cx="-22" cy="-22" r="8"/>
      <circle cx="12" cy="-34" r="6"/>
      <circle cx="-34" cy="16" r="7"/>
      <circle cx="8" cy="10" r="9"/>
      <circle cx="32" cy="34" r="6"/>
      <circle cx="-8" cy="42" r="5"/>
    </g>

    <!-- Refresh arrows -->
    <g fill="none" stroke="#ffffff" stroke-width="5"
       stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
      <path d="M -88 -20 A 92 92 0 0 1 -30 -88"/>
      <path d="M -30 -100 L -26 -86 L -40 -82"/>
      <path d="M 88 20 A 92 92 0 0 1 30 88"/>
      <path d="M 30 100 L 26 86 L 40 82"/>
    </g>
  </g>

  <!-- Right shield profile with pulsing light -->
  <g transform="translate(810 190)">

    <!-- Pulsing outer circle -->
    <circle r="101" fill="none" stroke="#54eaff" stroke-width="2"
            filter="url(#pulseGlow)">
      <animate attributeName="r" values="91;103;91" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.15;1;0.15" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <!-- Rotating light ring -->
    <circle r="93" fill="none" stroke="url(#title)" stroke-width="2"
            stroke-dasharray="7 13" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate"
                        from="360" to="0" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- Shield -->
    <path d="M 0 -84 L 66 -58 L 66 4 C 66 46 36 72 0 88
             C -36 72 -66 46 -66 4 L -66 -58 Z"
          fill="#092a2c" stroke="url(#title)" stroke-width="4"
          filter="url(#pulseGlow)">
      <animate attributeName="stroke-width" values="3;6;3" dur="2s" repeatCount="indefinite"/>
    </path>

    <!-- Key -->
    <circle cx="-14" cy="-12" r="18" fill="none"
            stroke="url(#gold)" stroke-width="8" filter="url(#glow)"/>
    <path d="M 0 -12 H 40 M 28 -12 V 4 M 40 -12 V 6"
          fill="none" stroke="url(#gold)" stroke-width="8"
          stroke-linecap="round" filter="url(#glow)"/>

    <!-- Check mark -->
    <path d="M -34 40 L -18 56 L 22 22"
          fill="none" stroke="#b7ff3c" stroke-width="7"
          stroke-linecap="round" stroke-linejoin="round"
          filter="url(#pulseGlow)"/>
  </g>

  <!-- Main title -->
  <g text-anchor="middle"
     font-family="'Segoe UI','Trebuchet MS',Arial,Helvetica,sans-serif"
     font-weight="900">

    <text x="480" y="168" font-size="104" letter-spacing="9"
          fill="url(#title)" filter="url(#strongGlow)">SIYAM</text>

    <text x="480" y="168" font-size="104" letter-spacing="9"
          fill="none" stroke="#ffffff" stroke-opacity="0.55"
          stroke-width="1.2">SIYAM</text>

    <text x="480" y="226" font-size="42" letter-spacing="22"
          fill="#ffffff" fill-opacity="0.96">CHAT BOT</text>
  </g>

  <!-- Divider -->
  <g transform="translate(480 252)">
    <rect x="-210" y="-1.5" width="186" height="3" rx="1.5" fill="url(#title)"/>
    <rect x="24" y="-1.5" width="186" height="3" rx="1.5" fill="url(#title)"/>
    <path d="M 0 -9 L 9 0 L 0 9 L -9 0 Z"
          fill="url(#gold)" filter="url(#pulseGlow)"/>
  </g>

  <!-- Ribbons -->
  <g font-family="'Segoe UI','Trebuchet MS',Arial,Helvetica,sans-serif"
     font-weight="800" text-anchor="middle">

    <rect x="262" y="272" width="436" height="42" rx="21"
          fill="url(#ribbon)" stroke="#b7ff3c" stroke-opacity="0.40"/>

    <text x="480" y="300" font-size="22" letter-spacing="3"
          fill="#dfff83" filter="url(#glow)">
      AUTO COOKIE  •  AUTO LOGIN
    </text>

    <rect x="232" y="326" width="496" height="42" rx="21"
          fill="url(#ribbon)" stroke="#54eaff" stroke-opacity="0.40"/>

    <text x="480" y="354" font-size="20" letter-spacing="2"
          fill="#b9faff">
      FACEBOOK SESSION  ALWAYS  ALIVE
    </text>
  </g>

  <!-- Bottom credit -->
  <text x="480" y="396" text-anchor="middle"
        font-family="'Segoe UI',Arial,sans-serif"
        font-size="13" letter-spacing="3"
        fill="#ffffff" fill-opacity="0.72">
    SIYAM HASAN  •  MIRAI + GOAT  •  COOKIE GUARDIAN
  </text>

  <!-- Sparkles -->
  <g fill="#ffffff" filter="url(#glow)">
    <circle cx="320" cy="60" r="2">
      <animate attributeName="opacity" values="0.1;1;0.1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="52" r="2.4">
      <animate attributeName="opacity" values="1;0.1;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="92" r="1.6">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="720" cy="100" r="1.8">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="340" r="2">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="710" cy="250" r="2">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
