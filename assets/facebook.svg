
<svg xmlns="http://www.w3.org/2000/svg"
     width="320" height="112" viewBox="0 0 320 112"
     role="img" aria-label="Facebook glass notification by Siyam Hasan">

  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="45%" stop-color="#a8d8ff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#1877F2" stop-opacity="0.22"/>
    </linearGradient>

    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#72caff"/>
      <stop offset="70%" stop-color="#1877F2"/>
      <stop offset="100%" stop-color="#d8f3ff"/>
      <animate attributeName="x1" values="0;1;0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60b8ff"/>
      <stop offset="100%" stop-color="#0866ff"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-40%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7"/>
      <feOffset dy="4"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.35"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="clip">
      <rect x="10" y="10" width="300" height="92" rx="25"/>
    </clipPath>
  </defs>

  <!-- Floating notification -->
  <g filter="url(#shadow)">
    <animateTransform attributeName="transform"
      type="translate" values="0 0;0 -3;0 0"
      dur="3s" repeatCount="indefinite"/>

    <!-- Glass body -->
    <rect x="10" y="10" width="300" height="92" rx="25"
          fill="url(#glass)"
          stroke="url(#border)" stroke-width="1.8"
          filter="url(#glow)"/>

    <!-- Glass reflection -->
    <rect x="13" y="13" width="294" height="86" rx="22"
          fill="none" stroke="#ffffff"
          stroke-opacity="0.35" stroke-width="1"/>

    <g clip-path="url(#clip)">
      <path d="M 15 12 H 305 L 245 50 H 15 Z"
            fill="#ffffff" opacity="0.07"/>

      <!-- Moving glass shine -->
      <rect x="-100" y="0" width="65" height="120"
            fill="url(#shine)" opacity="0.8"
            transform="skewX(-22)">
        <animate attributeName="x"
          values="-120;380" dur="3.2s"
          repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Facebook icon background -->
    <circle cx="52" cy="47" r="23"
            fill="url(#blue)" filter="url(#glow)"/>

    <circle cx="52" cy="47" r="23"
            fill="none" stroke="#ffffff"
            stroke-opacity="0.65" stroke-width="1.2"/>

    <!-- Facebook F -->
    <text x="52" y="58"
          font-family="Arial,sans-serif"
          font-size="32" font-weight="bold"
          text-anchor="middle" fill="#ffffff">f</text>

    <!-- Main title -->
    <text x="87" y="40"
          font-family="Segoe UI,Arial,sans-serif"
          font-size="19" font-weight="700"
          fill="#ffffff">Facebook</text>

    <!-- Subtitle -->
    <text x="87" y="59"
          font-family="Segoe UI,Arial,sans-serif"
          font-size="10.5" fill="#e7f5ff">
      Stay connected with Facebook
    </text>

    <!-- Notification dot -->
    <circle cx="287" cy="29" r="5" fill="#42ffad"
            filter="url(#glow)">
      <animate attributeName="opacity"
        values="0.3;1;0.3" dur="1.5s"
        repeatCount="indefinite"/>
    </circle>

    <!-- Bottom divider -->
    <path d="M 28 73 H 292"
          stroke="#ffffff" stroke-opacity="0.24"
          stroke-width="1"/>

    <!-- Owner signature -->
    <text x="160" y="90"
          font-family="Segoe UI,Arial,sans-serif"
          font-size="10" font-weight="800"
          letter-spacing="2"
          text-anchor="middle"
          fill="#ffffff" filter="url(#glow)">
      SIYAM HASAN
    </text>
  </g>
</svg>
