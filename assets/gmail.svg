
<svg xmlns="http://www.w3.org/2000/svg"
     width="320" height="112" viewBox="0 0 320 112">

  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#263B59"/>
      <stop offset="0.5" stop-color="#111C32"/>
      <stop offset="1" stop-color="#080F20"/>
    </linearGradient>

    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF5C64"/>
      <stop offset="0.35" stop-color="#FFD45C"/>
      <stop offset="0.7" stop-color="#36D9C5"/>
      <stop offset="1" stop-color="#8A78FF"/>
    </linearGradient>

    <linearGradient id="gmailRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7777"/>
      <stop offset="1" stop-color="#EA4335"/>
    </linearGradient>

    <linearGradient id="gmailBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#65B7FF"/>
      <stop offset="1" stop-color="#4285F4"/>
    </linearGradient>

    <linearGradient id="gmailGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#70E6A0"/>
      <stop offset="1" stop-color="#34A853"/>
    </linearGradient>

    <linearGradient id="gmailYellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE27A"/>
      <stop offset="1" stop-color="#FBBC04"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dy="4"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="clip">
      <rect x="8" y="9" width="304" height="94" rx="28"/>
    </clipPath>
  </defs>

  <!-- Floating background glow -->
  <ellipse cx="160" cy="56" rx="130" ry="40"
           fill="#4285F4" opacity="0.13">
    <animate attributeName="opacity"
             values="0.08;0.23;0.08"
             dur="3s" repeatCount="indefinite"/>
  </ellipse>

  <g filter="url(#shadow)">
    <!-- Outer animated border -->
    <rect x="8" y="9" width="304" height="94"
          rx="28" fill="none"
          stroke="url(#border)" stroke-width="2.5"
          filter="url(#glow)">
      <animate attributeName="stroke-opacity"
               values="0.45;1;0.45"
               dur="2.8s" repeatCount="indefinite"/>
    </rect>

    <!-- Glass body -->
    <rect x="10" y="11" width="300" height="90"
          rx="26" fill="url(#glass)"/>

    <!-- Glass reflection -->
    <g clip-path="url(#clip)">
      <path d="M10 20 Q150 -10 310 22 L310 43 Q150 17 10 45Z"
            fill="#FFFFFF" opacity="0.055"/>

      <path d="M-50 0 L-15 0 L110 112 L75 112Z"
            fill="#FFFFFF" opacity="0.07">
        <animateTransform attributeName="transform"
          type="translate" values="-130 0;360 0"
          dur="5s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Gmail icon background -->
    <circle cx="58" cy="55" r="27"
            fill="#FFFFFF" opacity="0.09"/>
    <circle cx="58" cy="55" r="27"
            fill="none" stroke="#FFFFFF"
            stroke-opacity="0.18"/>

    <!-- Gmail envelope icon -->
    <g transform="translate(40 41)">
      <path d="M1 5 Q1 1 5 1 H31 Q35 1 35 5 V27 H27 V10 L18 17 L9 10 V27 H1Z"
            fill="url(#gmailRed)"/>

      <path d="M1 5 L18 18 L35 5"
            fill="none" stroke="#EA4335"
            stroke-width="5" stroke-linecap="round"
            stroke-linejoin="round"/>

      <path d="M1 5 V27 H9 V11"
            fill="none" stroke="url(#gmailBlue)"
            stroke-width="5"/>

      <path d="M27 11 V27 H35 V5"
            fill="none" stroke="url(#gmailGreen)"
            stroke-width="5"/>

      <path d="M9 11 L18 18 L27 11"
            fill="none" stroke="url(#gmailYellow)"
            stroke-width="5" stroke-linejoin="round"/>
    </g>

    <!-- Main title -->
    <text x="101" y="51"
          font-family="Segoe UI, Arial, sans-serif"
          font-size="25" font-weight="800"
          fill="#FFFFFF" letter-spacing="1.2">
      Gmail
    </text>

    <!-- Subtitle -->
    <text x="102" y="70"
          font-family="Segoe UI, Arial, sans-serif"
          font-size="9.5" font-weight="500"
          fill="#B8C9E8" letter-spacing="1.2">
      CONNECT • COMMUNICATE
    </text>

    <!-- Online indicator -->
    <circle cx="286" cy="35" r="4" fill="#42E89B">
      <animate attributeName="opacity"
               values="1;0.25;1"
               dur="1.4s" repeatCount="indefinite"/>
    </circle>

    <!-- Developer signature -->
    <text x="160" y="88"
          font-family="Segoe UI, Arial, sans-serif"
          font-size="8.5" font-weight="700"
          text-anchor="middle"
          fill="#A9C5FF" letter-spacing="2">
      SIYAM HASAN
    </text>

    <!-- Bottom accent -->
    <path d="M133 94 H187"
          stroke="url(#border)" stroke-width="1.5"
          stroke-linecap="round">
      <animate attributeName="opacity"
               values="0.3;1;0.3"
               dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
