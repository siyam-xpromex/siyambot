
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="960" height="420" viewBox="0 0 960 420"
     role="img" aria-label="SIYAM HASAN Bot Status Telegram Notification">

  <title>SIYAM HASAN — BOT STATUS MONITOR</title>

  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="80%">
      <stop offset="0" stop-color="#142b4b"/>
      <stop offset=".55" stop-color="#071323"/>
      <stop offset="1" stop-color="#02050b"/>
    </radialGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6cf"/>
      <stop offset=".3" stop-color="#ffd56a"/>
      <stop offset=".65" stop-color="#b87918"/>
      <stop offset="1" stop-color="#fff0ad"/>
    </linearGradient>

    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8ffff"/>
      <stop offset=".5" stop-color="#00d9ff"/>
      <stop offset="1" stop-color="#2477ff"/>
    </linearGradient>

    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#baffd9"/>
      <stop offset="1" stop-color="#00d878"/>
    </linearGradient>

    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc4cc"/>
      <stop offset="1" stop-color="#ff304f"/>
    </linearGradient>

    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".025"/>
    </linearGradient>

    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00eaff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00eaff"/>
      <stop offset="1" stop-color="#00eaff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="aura">
      <stop offset="0" stop-color="#00cfff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#00cfff" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none"
            stroke="#6abfff" stroke-opacity=".055"/>
    </pattern>

    <clipPath id="screenClip">
      <rect x="69" y="202" width="130" height="79" rx="9"/>
    </clipPath>

    <path id="signalPath"
          d="M265 244 C330 244 350 244 410 244 S530 244 590 244 S650 244 695 244"
          fill="none"/>

    <style>
      .main {
        font-family: 'Segoe UI Black','Arial Black',Arial,sans-serif;
        font-weight: 900;
      }
      .text {
        font-family: 'Segoe UI',Arial,sans-serif;
        font-weight: 700;
      }
      .mono {
        font-family: 'Consolas','Courier New',monospace;
        font-weight: 700;
      }
    </style>
  </defs>

  <!-- BACKGROUND -->
  <rect width="960" height="420" rx="28" fill="url(#bg)"/>
  <rect width="960" height="420" rx="28" fill="url(#grid)"/>

  <circle cx="480" cy="205" r="330" fill="url(#aura)"/>

  <circle cx="110" cy="90" r="110" fill="#146bff" opacity=".08" filter="url(#softGlow)"/>
  <circle cx="850" cy="310" r="130" fill="#00d9ff" opacity=".08" filter="url(#softGlow)"/>

  <!-- FLOATING PARTICLES -->
  <g fill="#baf6ff" filter="url(#glow)">
    <circle cx="80" cy="170" r="1.5">
      <animate attributeName="cy" values="170;145;170" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="310" cy="70" r="2">
      <animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="680" cy="90" r="1.5">
      <animate attributeName="cy" values="90;110;90" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="180" r="2">
      <animate attributeName="opacity" values=".2;1;.2" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="510" cy="365" r="1.5">
      <animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- OUTER FRAME -->
  <rect x="4" y="4" width="952" height="412" rx="26"
        fill="none" stroke="url(#cyan)" stroke-width="1.6" opacity=".75"/>

  <rect x="10" y="10" width="940" height="400" rx="22"
        fill="none" stroke="#ffffff" stroke-opacity=".08"/>

  <rect x="4" y="4" width="952" height="412" rx="26"
        fill="none" stroke="#00dfff" stroke-width="3"
        stroke-dasharray="100 900" pathLength="1000"
        filter="url(#glow)">
    <animate attributeName="stroke-dashoffset"
             from="0" to="-1000" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- TOP BRAND -->
  <g>
    <text x="480" y="76" text-anchor="middle"
          class="main" font-size="49" letter-spacing="5"
          fill="#000" opacity=".8" filter="url(#softGlow)">
      SIYAM HASAN
    </text>

    <text x="480" y="76" text-anchor="middle"
          class="main" font-size="49" letter-spacing="5"
          fill="url(#gold)" stroke="#fff0b0" stroke-width=".5">
      SIYAM HASAN
    </text>

    <text x="480" y="105" text-anchor="middle"
          class="text" font-size="12" letter-spacing="5"
          fill="#8ddfff">
      INTELLIGENT BOT CONTROL SYSTEM
    </text>

    <path d="M270 119H690" stroke="url(#cyan)"
          stroke-width="1.2" opacity=".7"/>
    <circle cx="270" cy="119" r="3" fill="#00eaff" filter="url(#glow)"/>
    <circle cx="690" cy="119" r="3" fill="#00eaff" filter="url(#glow)"/>
  </g>

  <!-- LIVE MONITOR -->
  <g transform="translate(36 34)">
    <circle cx="0" cy="0" r="4" fill="#00ff9d" filter="url(#glow)">
      <animate attributeName="opacity" values="1;.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="12" y="4" class="mono" font-size="9"
          letter-spacing="2" fill="#9bb5d3">SYSTEM MONITOR</text>
  </g>

  <!-- SERVER BASE AURA -->
  <ellipse cx="140" cy="321" rx="105" ry="20"
           fill="#00eaff" opacity=".12" filter="url(#softGlow)"/>

  <!-- SERVER MACHINE -->
  <g>
    <rect x="43" y="169" width="194" height="153" rx="17"
          fill="#030912" stroke="#516783" stroke-width="2"/>

    <rect x="48" y="174" width="184" height="143" rx="13"
          fill="url(#glass)" stroke="#9adfff" stroke-opacity=".18"/>

    <rect x="61" y="191" width="146" height="101" rx="11"
          fill="#020913" stroke="#33516b" stroke-width="1.4"/>

    <rect x="69" y="202" width="130" height="79" rx="9"
          fill="#06182a"/>

    <g clip-path="url(#screenClip)">
      <path d="M60 200L125 200L70 290L60 290Z"
            fill="#ffffff" opacity=".035"/>
    </g>

    <text x="78" y="218" class="mono" font-size="8"
          letter-spacing="2" fill="#7296b5">SERVER STATUS</text>

    <!-- ONLINE SCREEN -->
    <g>
      <animate attributeName="opacity"
               values="1;1;0;0;1" keyTimes="0;.48;.5;.98;1"
               dur="12s" repeatCount="indefinite"/>

      <text x="78" y="250" class="main" font-size="22"
            fill="url(#green)" filter="url(#glow)">ONLINE</text>

      <circle cx="183" cy="244" r="5" fill="#00ff91" filter="url(#glow)">
        <animate attributeName="opacity" values="1;.3;1" dur="1s" repeatCount="indefinite"/>
      </circle>

      <path d="M79 264H185" stroke="#00ff91" stroke-opacity=".55" stroke-width="2"/>
      <text x="79" y="276" class="mono" font-size="7"
            fill="#82cdb0">ALL SYSTEMS ACTIVE</text>
    </g>

    <!-- OFFLINE SCREEN -->
    <g opacity="0">
      <animate attributeName="opacity"
               values="0;0;1;1;0" keyTimes="0;.48;.5;.98;1"
               dur="12s" repeatCount="indefinite"/>

      <text x="78" y="250" class="main" font-size="21"
            fill="url(#red)" filter="url(#glow)">OFFLINE</text>

      <circle cx="183" cy="244" r="5" fill="#ff405c" filter="url(#glow)">
        <animate attributeName="opacity" values="1;.25;1" dur=".8s" repeatCount="indefinite"/>
      </circle>

      <path d="M79 264H185" stroke="#ff405c" stroke-opacity=".65" stroke-width="2"/>
      <text x="79" y="276" class="mono" font-size="7"
            fill="#ff9da9">CONNECTION STOPPED</text>
    </g>

    <!-- SERVER DETAILS -->
    <g fill="#526a82">
      <rect x="69" y="301" width="102" height="4" rx="2"/>
      <rect x="69" y="309" width="76" height="4" rx="2"/>
    </g>

    <circle cx="192" cy="305" r="4" fill="#00eaff" filter="url(#glow)">
      <animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="140" y="349" text-anchor="middle"
        class="text" font-size="13" letter-spacing="4"
        fill="#c5d9ee">BOT SERVER</text>

  <!-- SERVER STATUS LABEL -->
  <g text-anchor="middle" class="mono" font-size="10" letter-spacing="2">
    <text x="140" y="370" fill="#00ff9d">
      ● ONLINE
      <animate attributeName="opacity"
               values="1;1;0;0;1" keyTimes="0;.48;.5;.98;1"
               dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="140" y="370" fill="#ff5066" opacity="0">
      ● OFFLINE
      <animate attributeName="opacity"
               values="0;0;1;1;0" keyTimes="0;.48;.5;.98;1"
               dur="12s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- SIGNAL CONNECTION -->
  <use xlink:href="#signalPath" href="#signalPath"
       stroke="#172d49" stroke-width="10" stroke-linecap="round"/>

  <use xlink:href="#signalPath" href="#signalPath"
       stroke="#00cfff" stroke-width="1.5" opacity=".5"/>

  <!-- GREEN SIGNAL -->
  <g>
    <animate attributeName="opacity"
             values="1;1;0;0;1" keyTimes="0;.48;.5;.98;1"
             dur="12s" repeatCount="indefinite"/>

    <use xlink:href="#signalPath" href="#signalPath"
         stroke="#00ff9d" stroke-width="3"
         stroke-dasharray="8 13" filter="url(#glow)">
      <animate attributeName="stroke-dashoffset"
               from="42" to="0" dur=".8s" repeatCount="indefinite"/>
    </use>

    <circle r="5" fill="#00ff9d" filter="url(#glow)">
      <animateMotion dur="2s" repeatCount="indefinite">
        <mpath xlink:href="#signalPath" href="#signalPath"/>
      </animateMotion>
    </circle>
  </g>

  <!-- RED SIGNAL -->
  <g opacity="0">
    <animate attributeName="opacity"
             values="0;0;1;1;0" keyTimes="0;.48;.5;.98;1"
             dur="12s" repeatCount="indefinite"/>

    <use xlink:href="#signalPath" href="#signalPath"
         stroke="#ff405c" stroke-width="3"
         stroke-dasharray="8 13" filter="url(#glow)">
      <animate attributeName="stroke-dashoffset"
               from="42" to="0" dur="1.1s" repeatCount="indefinite"/>
    </use>

    <circle r="5" fill="#ff405c" filter="url(#glow)">
      <animateMotion dur="2s" repeatCount="indefinite">
        <mpath xlink:href="#signalPath" href="#signalPath"/>
      </animateMotion>
    </circle>
  </g>

  <!-- CONNECTION NODE -->
  <circle cx="480" cy="244" r="24" fill="#061a2a"
          stroke="#2d7091" stroke-width="1.5"/>

  <circle cx="480" cy="244" r="17" fill="none"
          stroke="#00dfff" stroke-width="1.4" filter="url(#glow)">
    <animate attributeName="r" values="14;22;14" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".3;1;.3" dur="2s" repeatCount="indefinite"/>
  </circle>

  <path d="M470 244H490M480 234V254"
        stroke="#b8faff" stroke-width="2" stroke-linecap="round"/>

  <!-- TELEGRAM NOTIFICATION CARD -->
  <g>
    <rect x="705" y="169" width="205" height="153" rx="17"
          fill="#030b17" stroke="#397da0" stroke-width="1.8"/>

    <rect x="710" y="174" width="195" height="143" rx="13"
          fill="url(#glass)" stroke="#a3edff" stroke-opacity=".18"/>

    <circle cx="807" cy="224" r="43" fill="#168bd0" opacity=".12" filter="url(#softGlow)"/>

    <circle cx="807" cy="224" r="32"
            fill="#168bd0" stroke="#75dfff" stroke-width="1.5"
            filter="url(#glow)"/>

    <path d="M784 222L827 205Q831 203 829 209L821 244Q820 248 816 245L803 235L795 242Q792 244 792 239L794 229L784 225Q780 223 784 222Z"
          fill="#ffffff"/>

    <path d="M794 229L820 211L803 235"
          fill="none" stroke="#bcefff" stroke-width="1.5"
          stroke-linecap="round"/>

    <text x="807" y="279" text-anchor="middle"
          class="main" font-size="19" fill="#ffffff">TELEGRAM</text>

    <text x="807" y="296" text-anchor="middle"
          class="mono" font-size="8" letter-spacing="2"
          fill="#83dfff">NOTICE DELIVERY</text>

    <circle cx="884" cy="188" r="4" fill="#00ff9d" filter="url(#glow)">
      <animate attributeName="opacity" values="1;.2;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="807" y="349" text-anchor="middle"
        class="text" font-size="13" letter-spacing="4"
        fill="#c5d9ee">TELEGRAM ALERT</text>

  <text x="807" y="370" text-anchor="middle"
        class="mono" font-size="9" letter-spacing="2"
        fill="#68cfff">SIYAM NOTIFICATION</text>

  <!-- STATUS NOTIFICATION TEXT -->
  <g text-anchor="middle" class="mono" font-size="9" letter-spacing="1">
    <text x="480" y="303" fill="#00ff9d">
      BOT STARTED • ONLINE NOTICE
      <animate attributeName="opacity"
               values="1;1;0;0;1" keyTimes="0;.48;.5;.98;1"
               dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="480" y="303" fill="#ff6274" opacity="0">
      BOT STOPPED • OFFLINE NOTICE
      <animate attributeName="opacity"
               values="0;0;1;1;0" keyTimes="0;.48;.5;.98;1"
               dur="12s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- BOTTOM FOOTER -->
  <path d="M245 389H715" stroke="#4b7797" stroke-opacity=".45"/>
  <circle cx="245" cy="389" r="2.5" fill="#00dfff"/>
  <circle cx="715" cy="389" r="2.5" fill="#00dfff"/>

  <text x="480" y="405" text-anchor="middle"
        class="mono" font-size="8" letter-spacing="3"
        fill="#7799b8">
    POWERED BY SIYAM HASAN • BOT MANAGEMENT SYSTEM
  </text>

  <!-- CLICKABLE TELEGRAM LINK -->
  <a href="https://t.me/ri_siyam"
     xlink:href="https://t.me/ri_siyam"
     target="_blank">
    <rect x="700" y="160" width="215" height="170"
          rx="18" fill="#ffffff" opacity=".001"/>
  </a>

</svg>
