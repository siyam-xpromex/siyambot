
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="340" height="120" viewBox="0 0 340 120"
     role="img" aria-label="Siyam Hasan Telegram">

  <title>SIYAM HASAN - Telegram Cosmic Portal</title>

  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b25"/>
      <stop offset=".48" stop-color="#142d50"/>
      <stop offset="1" stop-color="#090d27"/>
    </linearGradient>

    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9ffff">
        <animate attributeName="stop-color"
          values="#d9ffff;#00eaff;#bd8aff;#fff0b0;#d9ffff"
          dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset=".48" stop-color="#00d9ff">
        <animate attributeName="stop-color"
          values="#00d9ff;#a66bff;#00ffc8;#00d9ff"
          dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#b98aff"/>
    </linearGradient>

    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".22" stop-color="#b9faff"/>
      <stop offset=".52" stop-color="#278ec7"/>
      <stop offset="1" stop-color="#102f70"/>
    </linearGradient>

    <linearGradient id="textGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#c5faff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>

    <radialGradient id="energy">
      <stop offset="0" stop-color="#00eaff" stop-opacity=".42"/>
      <stop offset="1" stop-color="#00eaff" stop-opacity="0"/>
    </radialGradient>

    <filter id="neon" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="deepGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <clipPath id="inside">
      <rect x="12" y="13" width="316" height="94" rx="29"/>
    </clipPath>
  </defs>

  <!-- Cosmic background -->
  <rect width="340" height="120" rx="27" fill="url(#space)"/>

  <ellipse cx="170" cy="60" rx="180" ry="90"
           fill="url(#energy)"/>

  <!-- Background orbit -->
  <g fill="none" stroke="#62eaff" opacity=".22">
    <ellipse cx="170" cy="60" rx="145" ry="43"
             stroke-width="1" transform="rotate(-12 170 60)">
      <animateTransform attributeName="transform"
        type="rotate" from="-12 170 60" to="348 170 60"
        dur="18s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Outer energy glow -->
  <rect x="9" y="10" width="322" height="100" rx="32"
        fill="none" stroke="#00dfff" stroke-width="5"
        opacity=".3" filter="url(#deepGlow)">
    <animate attributeName="opacity"
      values=".15;.65;.15" dur="2.5s"
      repeatCount="indefinite"/>
  </rect>

  <!-- Holographic border -->
  <rect x="10" y="11" width="320" height="98" rx="31"
        fill="none" stroke="url(#holo)" stroke-width="2.8"
        filter="url(#neon)">
    <animate attributeName="stroke-width"
      values="2;3.5;2" dur="2.4s"
      repeatCount="indefinite"/>
  </rect>

  <rect x="16" y="17" width="308" height="86" rx="25"
        fill="none" stroke="#ffffff"
        stroke-opacity=".2" stroke-width="1"/>

  <!-- Main glass panel -->
  <rect x="17" y="18" width="306" height="84" rx="24"
        fill="#0b2440" opacity=".88"/>

  <g clip-path="url(#inside)">
    <path d="M-90 0 L-35 0 L100 120 L45 120Z"
          fill="#ffffff" opacity=".09">
      <animateTransform attributeName="transform"
        type="translate" values="-100 0;460 0"
        dur="3.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Rotating portal rings -->
  <g transform="translate(65 60)" fill="none"
     filter="url(#neon)">
    <circle r="31" stroke="url(#holo)"
            stroke-width="1.8" stroke-dasharray="45 12 8 12">
      <animateTransform attributeName="transform"
        type="rotate" from="0" to="360"
        dur="7s" repeatCount="indefinite"/>
    </circle>

    <circle r="26" stroke="#62eaff"
            stroke-width="1" stroke-dasharray="3 7">
      <animateTransform attributeName="transform"
        type="rotate" from="360" to="0"
        dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Telegram icon -->
  <g transform="translate(65 60)">
    <circle r="22" fill="url(#metal)" filter="url(#neon)"/>
    <circle r="19" fill="#168bd0"/>

    <path d="M-13 -1 L13 -12
             Q17 -14 15 -9
             L10 12
             Q9 16 6 13
             L-1 7
             L-6 11
             Q-8 13 -8 9
             L-7 3
             L-13 1
             Q-17 -1 -13 -1Z"
          fill="#ffffff"/>

    <path d="M-7 3 L9 -7 L-1 7"
          fill="none" stroke="#a9eaff"
          stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Text -->
  <text x="111" y="57"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="27" font-weight="900"
        fill="url(#textGradient)" letter-spacing=".3">
    Telegram
    <animate attributeName="opacity"
      values=".85;1;.85" dur="2.5s"
      repeatCount="indefinite"/>
  </text>

  <text x="113" y="77"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="8.5" font-weight="700"
        fill="#80eaff" letter-spacing="2.1">
    ENTER THE DIGITAL UNIVERSE
  </text>

  <!-- Right side energy orb -->
  <g transform="translate(286 60)" filter="url(#neon)">
    <circle r="12" fill="none" stroke="#64edff"
            stroke-width="1.3" opacity=".8">
      <animate attributeName="r"
        values="9;16;9" dur="2s"
        repeatCount="indefinite"/>
      <animate attributeName="opacity"
        values=".8;0;.8" dur="2s"
        repeatCount="indefinite"/>
    </circle>
    <path d="M-4 -5 L5 0 L-4 5Z" fill="#ffffff"/>
  </g>

  <!-- Floating particles -->
  <g fill="#c9ffff" filter="url(#neon)">
    <circle cx="120" cy="28" r="1.6">
      <animate attributeName="opacity"
        values=".2;1;.2" dur="1.5s"
        repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="91" r="1.8">
      <animate attributeName="opacity"
        values="1;.2;1" dur="1.8s"
        repeatCount="indefinite"/>
    </circle>
    <circle cx="306" cy="31" r="1.5">
      <animate attributeName="opacity"
        values=".1;1;.1" dur="1.3s"
        repeatCount="indefinite"/>
    </circle>
    <circle cx="35" cy="91" r="1.5">
      <animate attributeName="opacity"
        values="1;.1;1" dur="1.6s"
        repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Creator signature -->
  <text x="170" y="117" text-anchor="middle"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="7" font-weight="800"
        fill="#a7dfff" letter-spacing="2.4">
    SIYAM HASAN • OFFICIAL
  </text>

  <!-- Clickable Telegram destination -->
  <a href="https://t.me/ri_siyam"
     xlink:href="https://t.me/ri_siyam"
     target="_blank">
    <rect x="10" y="11" width="320" height="98"
          rx="31" fill="#ffffff" opacity=".001"/>
  </a>

</svg>
