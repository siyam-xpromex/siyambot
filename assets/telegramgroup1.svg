
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 420 140" width="420" height="140"
     role="img" aria-label="SIYAM HASAN Telegram Support Group">
<title>SIYAM HASAN - Telegram Support Group</title>
<defs>
  <linearGradient id="tbg" x2="1" y2="1">
    <stop stop-color="#07152c"/>
    <stop offset=".55" stop-color="#103d70"/>
    <stop offset="1" stop-color="#080d27"/>
  </linearGradient>
  <linearGradient id="tbtn" x2="1" y2="1">
    <stop stop-color="#72edff"/>
    <stop offset=".5" stop-color="#168eff"/>
    <stop offset="1" stop-color="#514cff"/>
  </linearGradient>
  <linearGradient id="tline">
    <stop stop-color="#a6faff"/>
    <stop offset=".5" stop-color="#21bfff"/>
    <stop offset="1" stop-color="#a98bff"/>
  </linearGradient>
  <filter id="tglow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="tclip">
    <rect x="8" y="8" width="404" height="124" rx="27"/>
  </clipPath>
</defs>

<rect width="420" height="140" rx="30" fill="url(#tbg)"/>
<rect x="5" y="5" width="410" height="130" rx="28"
      fill="none" stroke="url(#tline)" stroke-width="2"
      filter="url(#tglow)"/>

<g clip-path="url(#tclip)">
  <circle cx="70" cy="65" r="65" fill="#00bfff" opacity=".15"/>
  <circle cx="360" cy="25" r="80" fill="#9d72ff" opacity=".10"/>
  <path d="M-20 130L100 0H145L25 140Z" fill="#ffffff" opacity=".035"/>
  <path d="M-60 0L-10 0L150 150L100 150Z"
        fill="#ffffff" opacity=".13">
    <animateTransform attributeName="transform" type="translate"
      values="-180 0;480 0" dur="4s" repeatCount="indefinite"/>
  </path>
</g>

<!-- Telegram group emblem -->
<g transform="translate(77 70)" filter="url(#tglow)">
  <circle r="43" fill="#ffffff" opacity=".12"/>
  <circle r="34" fill="url(#tbtn)"/>
  <path d="M-23 -2L23 -20Q27 -21 25 -16L16 20
           Q15 24 11 21L0 12L-9 20L-7 7L13 -10
           L-4 2L-23 -2Z"
        fill="#ffffff"/>
  <circle cx="24" cy="-26" r="6" fill="#b8faff">
    <animate attributeName="opacity" values=".3;1;.3"
             dur="1.5s" repeatCount="indefinite"/>
  </circle>
</g>

<!-- Text -->
<text x="140" y="56" font-family="Arial,sans-serif"
      font-size="25" font-weight="900" fill="#ffffff">
  Telegram
</text>
<text x="140" y="81" font-family="Arial,sans-serif"
      font-size="17" font-weight="800" fill="#b9eaff"
      letter-spacing="1.5">SUPPORT GROUP</text>
<text x="141" y="104" font-family="Arial,sans-serif"
      font-size="9" font-weight="700" fill="#dceaff"
      letter-spacing="2.5">JOIN OUR COMMUNITY</text>

<!-- Join arrow -->
<g transform="translate(365 70)" filter="url(#tglow)">
  <circle r="20" fill="#ffffff" opacity=".14"
          stroke="#b9eaff" stroke-width="1.5"/>
  <path d="M-7 0H8M2 -7L9 0L2 7"
        fill="none" stroke="#ffffff" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round"/>
</g>

<text x="210" y="127" text-anchor="middle"
      font-family="Arial,sans-serif" font-size="7"
      fill="#a6d9ff" letter-spacing="2">SIYAM HASAN • OFFICIAL COMMUNITY</text>
</svg>
  
