
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="320" height="120" viewBox="0 0 320 120"
     role="img" aria-label="Siyam Hasan WhatsApp Button">

  <title>SIYAM HASAN - WhatsApp</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061c2b"/>
      <stop offset=".5" stop-color="#073d43"/>
      <stop offset="1" stop-color="#07182e"/>
    </linearGradient>

    <linearGradient id="button" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f5c8"/>
      <stop offset=".48" stop-color="#00bfa5"/>
      <stop offset="1" stop-color="#0878c9"/>
    </linearGradient>

    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8affeb"/>
      <stop offset=".5" stop-color="#00d9ff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>

    <linearGradient id="hand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0d9"/>
      <stop offset="1" stop-color="#e5a878"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0" stop-color="#00ffd0" stop-opacity=".42"/>
      <stop offset="1" stop-color="#00ffd0" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="clip">
      <rect x="12" y="15" width="296" height="90" rx="28"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="320" height="120" rx="22" fill="url(#bg)"/>

  <ellipse cx="160" cy="60" rx="155" ry="65"
           fill="url(#glow)" opacity=".8"/>

  <!-- Ambient lights -->
  <g fill="#36ffe0">
    <circle cx="25" cy="23" r="2">
      <animate attributeName="opacity" values=".2;1;.2"
               dur="1.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="293" cy="91" r="2">
      <animate attributeName="opacity" values="1;.2;1"
               dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="25" r="1.5">
      <animate attributeName="opacity" values=".2;1;.2"
               dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="38" cy="95" r="1.5">
      <animate attributeName="opacity" values="1;.2;1"
               dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Button glow -->
  <rect x="10" y="13" width="300" height="94" rx="30"
        fill="#00eac2" opacity=".22" filter="url(#shadow)">
    <animate attributeName="opacity" values=".2;.55;.2"
             dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- Animated button -->
  <g>
    <animateTransform attributeName="transform"
      type="translate" values="0 0;0 -2;0 0"
      dur="2.4s" repeatCount="indefinite"/>

    <rect x="12" y="15" width="296" height="90" rx="28"
          fill="none" stroke="url(#border)" stroke-width="2.5"
          filter="url(#softGlow)">
      <animate attributeName="stroke-width"
               values="2;3.5;2" dur="2s"
               repeatCount="indefinite"/>
    </rect>

    <rect x="17" y="20" width="286" height="80" rx="24"
          fill="url(#button)"/>

    <!-- Shine sweep -->
    <g clip-path="url(#clip)">
      <path d="M-70 10 L-25 10 L65 115 L20 115Z"
            fill="#ffffff" opacity=".18">
        <animateTransform attributeName="transform"
          type="translate" values="-100 0;390 0"
          dur="3s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- WhatsApp icon -->
    <g transform="translate(65 60)" filter="url(#softGlow)">
      <circle r="25" fill="#ffffff" opacity=".17"/>
      <circle r="21" fill="#ffffff"/>

      <path d="M-12 12 L-16 19 L-5 16
               C7 21 19 11 19 0
               C19 -11 9 -19 -1 -19
               C-12 -19 -20 -10 -20 1
               C-20 5 -17 10 -12 12Z"
            fill="#12b98d"/>

      <path d="M-7 -10
               C-9 -12 -12 -9 -11 -5
               C-9 3 -2 10 6 11
               C10 11 12 7 9 5
               L5 3 L2 6
               C-2 4 -5 1 -6 -3
               L-3 -6Z"
            fill="#ffffff"/>
    </g>

    <!-- Button text -->
    <text x="103" y="57"
          font-family="Segoe UI, Arial, sans-serif"
          font-size="25" font-weight="800"
          fill="#ffffff" letter-spacing=".4">
      WhatsApp
    </text>

    <text x="105" y="77"
          font-family="Segoe UI, Arial, sans-serif"
          font-size="9" font-weight="700"
          fill="#d8fff7" letter-spacing="2">
      CHAT WITH US
    </text>

    <circle cx="278" cy="59" r="4" fill="#dffff8">
      <animate attributeName="opacity"
               values=".3;1;.3" dur="1.2s"
               repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Virtual clicking hand -->
  <g>
    <animateTransform attributeName="transform"
      type="translate"
      values="0 0;0 0;0 0;0 7;0 0;0 0"
      keyTimes="0;.25;.42;.50;.58;1"
      dur="2.8s" repeatCount="indefinite"/>

    <g transform="translate(239 1) scale(.78)"
       filter="url(#softGlow)">
      <!-- Finger and hand -->
      <path d="M20 0
               C16 0 14 3 14 7
               L14 29
               L9 23
               C6 19 1 20 -1 23
               C-3 26 -1 29 2 33
               L15 49
               C19 54 25 57 32 57
               L42 57
               C53 57 60 49 60 39
               L60 30
               C60 25 54 23 50 27
               C48 22 42 22 39 26
               C36 22 30 23 28 27
               L28 7
               C28 3 25 0 20 0Z"
            fill="url(#hand)" stroke="#ffffff"
            stroke-width="1.5" stroke-linejoin="round"/>

      <path d="M17 31 L17 8"
            stroke="#fff8eb" stroke-width="2"
            stroke-linecap="round" opacity=".7"/>
    </g>
  </g>

  <!-- Click ripple -->
  <circle cx="252" cy="68" r="5"
          fill="none" stroke="#ffffff" stroke-width="2"
          opacity="0">
    <animate attributeName="r"
      values="5;20;5" dur="2.8s"
      repeatCount="indefinite"/>
    <animate attributeName="opacity"
      values="0;0;.8;0;0" dur="2.8s"
      repeatCount="indefinite"/>
  </circle>

  <!-- Creator credit -->
  <text x="160" y="116" text-anchor="middle"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="7" font-weight="700"
        fill="#8fffee" letter-spacing="2">
    SIYAM HASAN
  </text>

  <!-- Actual clickable link -->
  <a xlink:href="https://www.whatsapp.com/"
     href="https://www.whatsapp.com/"
     target="_blank">
    <rect x="12" y="15" width="296" height="90"
          rx="28" fill="#ffffff" opacity="0.001"/>
  </a>

</svg>
