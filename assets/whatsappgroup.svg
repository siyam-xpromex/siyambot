
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 420 140" width="420" height="140"
     role="img" aria-label="SIYAM HASAN WhatsApp Support Group">
<title>SIYAM HASAN - WhatsApp Support Group</title>
<defs>
  <linearGradient id="wbg" x2="1" y2="1">
    <stop stop-color="#061b25"/>
    <stop offset=".55" stop-color="#075b4b"/>
    <stop offset="1" stop-color="#03121d"/>
  </linearGradient>
  <linearGradient id="wbtn" x2="1" y2="1">
    <stop stop-color="#28f5b2"/>
    <stop offset=".55" stop-color="#0abf83"/>
    <stop offset="1" stop-color="#087d73"/>
  </linearGradient>
  <linearGradient id="wline">
    <stop stop-color="#aaffdf"/>
    <stop offset=".5" stop-color="#00ffd0"/>
    <stop offset="1" stop-color="#7affc5"/>
  </linearGradient>
  <filter id="wglow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="wclip">
    <rect x="8" y="8" width="404" height="124" rx="27"/>
  </clipPath>
</defs>

<rect width="420" height="140" rx="30" fill="url(#wbg)"/>
<rect x="5" y="5" width="410" height="130" rx="28"
      fill="none" stroke="url(#wline)" stroke-width="2"
      filter="url(#wglow)"/>

<g clip-path="url(#wclip)">
  <circle cx="75" cy="65" r="65" fill="#00ffb0" opacity=".12"/>
  <circle cx="360" cy="25" r="80" fill="#00ffb0" opacity=".08"/>
  <path d="M-20 130L100 0H145L25 140Z" fill="#ffffff" opacity=".035"/>
  <path d="M250 150L390 0H420L290 150Z" fill="#ffffff" opacity=".04"/>
  <path d="M-60 0L-10 0L150 150L100 150Z"
        fill="#ffffff" opacity=".13">
    <animateTransform attributeName="transform" type="translate"
      values="-180 0;480 0" dur="4s" repeatCount="indefinite"/>
  </path>
</g>

<!-- WhatsApp group emblem -->
<g transform="translate(77 70)" filter="url(#wglow)">
  <circle r="43" fill="#ffffff" opacity=".12"/>
  <circle r="34" fill="#ffffff"/>
  <path d="M-19 17L-25 29L-10 25C8 33 28 19 28 1
           C28 -16 15 -29 -2 -29C-20 -29 -33 -15 -33 2
           C-33 8 -29 14 -19 17Z"
        fill="#12bd83" transform="translate(2 0) scale(.82)"/>
  <path d="M-9 -14C-13 -16 -16 -11 -14 -6
           C-11 3 -4 11 5 13
           C11 14 14 8 10 5L5 2L1 6
           C-4 3 -7 -1 -8 -5L-4 -9Z"
        fill="#ffffff" transform="scale(.85)"/>
  <circle cx="24" cy="-26" r="6" fill="#aaffd9">
    <animate attributeName="opacity" values=".3;1;.3"
             dur="1.5s" repeatCount="indefinite"/>
  </circle>
</g>

<!-- Text -->
<text x="140" y="56" font-family="Arial,sans-serif"
      font-size="25" font-weight="900" fill="#ffffff">
  WhatsApp
</text>
<text x="140" y="81" font-family="Arial,sans-serif"
      font-size="17" font-weight="800" fill="#aaffd9"
      letter-spacing="1.5">SUPPORT GROUP</text>
<text x="141" y="104" font-family="Arial,sans-serif"
      font-size="9" font-weight="700" fill="#d4fff0"
      letter-spacing="2.5">JOIN OUR COMMUNITY</text>

<!-- Join arrow -->
<g transform="translate(365 70)" filter="url(#wglow)">
  <circle r="20" fill="#ffffff" opacity=".14"
          stroke="#aaffd9" stroke-width="1.5"/>
  <path d="M-7 0H8M2 -7L9 0L2 7"
        fill="none" stroke="#ffffff" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round"/>
</g>

<text x="210" y="127" text-anchor="middle"
      font-family="Arial,sans-serif" font-size="7"
      fill="#91e9cf" letter-spacing="2">SIYAM HASAN • OFFICIAL COMMUNITY</text>
</svg>
